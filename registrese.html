<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Formulário</title>

   <link rel="stylesheet" href="style.css">




    <style>

.form{
    display: flex;
    justify-content: center;
}
    

.aba{
    background: white;
text-align: center;
border: 1px black solid;
border-radius: 20px;
margin-top: 10%;
display: inline-block;
padding: 70px;
box-shadow: 1px 1px 4px;
padding-left: 80px;
padding-right: 80px;

}

.perg{
    border-radius: 20px;
    border: 1px black solid;
    padding: 20px;
}

.perg:hover{
   
    box-shadow: 1px 0 5px black;
}

.botao{
    border: 0;
border-radius: 20px;
background: #ADEBB3;
color: black;
width: 100%;
cursor: pointer;
box-shadow: 1px 1px 3px black;
height: 30px;
}

.botao:hover{
box-shadow: 0 0 0 ;
}
    </style>



</head> 
<body style="margin: 0;padding: 0;"> 

    <div class="primeiro">
    <h1 style="text-align: left; font-size: 50px; display: flex;">Zyno</h1>
    
<div class="linksorig">
 <a href="index.html" class="links">Início</a>

   <a href="#" class="links">Entrar</a>
</div>
</div>




<div class="form">
<form class="aba" >

        <p style="font-size: 30px;">Registre-se</p>

    
    <input placeholder="Nome" class="perg" required type="text">

    <br><br>
    <input placeholder="Email" class="perg" required type="email">

   <br><br>
    <input placeholder="Senha" class="perg" required type="text">

    <br><br>
    <input placeholder="Telefone" class="perg" required type="number">

<br><br><br>
     <input class="botao"  type="submit">

</div>
</form>
